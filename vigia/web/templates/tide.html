<svg class="tide" viewBox="0 0 {{ tide.width | int }} 28" role="img" aria-label="{{ t('tide.label', n=tide.total) }}">
  <line class="tide-line" x1="{{ tide.left }}" y1="14" x2="{{ tide.right }}" y2="14"/>
  {% for mark in tide.marks %}
  <circle class="tide-mark" cx="{{ mark.x }}" cy="14" r="3.5"><title>{{ mark.ts }}</title></circle>
  {% endfor %}
  <circle class="tide-head" cx="{{ tide.right }}" cy="14" r="6"/>
</svg>
<p class="tide-scale"><span>{{ t('tide.from') }}</span><span>{{ t('tide.now') }}</span></p>
