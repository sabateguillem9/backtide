# Manifiesto de la batería del agente malvado (T05): una entrada por escenario.
#
# Cada escenario declara lo que esperamos de backtide en cinco dimensiones:
#
#   stopped      ¿se frena el ataque?      yes | contained (corre, pero un tope lo para) |
#                                           no (no se puede impedir: se recupera) | n/a
#   recorded     ¿queda grabado / se detecta?   yes | no | n/a
#   risk         nivel de riesgo (0-3) del evento   0 | 1 | 2 | 3 | n/a
#   recoverable  ¿se puede volver atrás con una instantánea?   yes | no | n/a
#   held         ¿la puerta lo retiene hasta aprobarlo?   yes | no | n/a
#
# Cualquiera de ellas puede ser "pending:Txx": lo que se espera existe en cuanto se
# construya esa tarea. Una dimensión pendiente NUNCA se comprueba ni se da por buena: la
# batería la imprime como "pendiente (Txx)". Al terminar la tarea, se cambia aquí el valor
# y el test del escenario tiene que comprobarlo (si no, la batería falla).
#
# status = "ready": hay un test que se ejecuta hoy (tests/attacks/test_*.py, con
#   @scenario("<id>")) y, si ataca desde dentro, un script en tests/attacks/scripts/.
# status = "pending": todavía no se puede escribir (falta la tarea `task`). Se lista en el
#   informe como pendiente y se queda sin test hasta entonces. Los valores de `expect` son
#   los que se esperan cuando se construya.
#
# Cómo se enchufa una tarea nueva (T04, T06-T10...):
#   1. Un escenario pendiente que ya se puede hacer: status = "ready", se quita `task`, y se
#      escribe su test con @scenario("<id>") (más un script en scripts/ si ataca desde dentro).
#   2. Una dimensión pendiente de la tarea: se cambia "pending:Txx" por su valor final y el
#      test del escenario llama a attack.check("<dimensión>", ...). Si se olvida cualquiera de
#      las dos cosas, `make ataques` (o `make test`) falla.
#
# invariants: números de las invariantes de seguridad de CLAUDE.md que prueba el escenario
#   (7 = "cada función de seguridad lleva su escenario": la función de esa tarea).

# ---------------------------------------------------------------------------------------
# Activos hoy (T01-T03b: jaula, seccomp, tope de espacio, instantáneas y caja negra)
