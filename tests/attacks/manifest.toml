story = """Desde la VM, 192.168.5.2 (`host.lima.internal`) es el `127.0.0.1` del Mac, donde escuchan sus servicios (un modelo local, un servidor de desarrollo, la web reenviada). El agente lo intenta por IP y por nombre en varios puertos, y con la sonda de la web desde la cárcel (también pidiéndoselo al proxy): la jaula no tiene ninguna ruta que lo cubra, el núcleo contesta «sin ruta» en el acto y el proxy no lo deja pasar. Control: desde la VM, el Mac contesta."""
