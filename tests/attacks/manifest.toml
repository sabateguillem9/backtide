story = """Con el servicio y la web en marcha en el anfitrión (127.0.0.1, puertos 8765 y 8766), \
el agente prueba a conectar a esos puertos por su propio loopback, por las direcciones IPv4 e \
IPv6 del anfitrión (también las de enlace local), por las pasarelas que tendría su red (y su \
pasarela IPv6, si la red tiene IPv6; si no, se comprueba que no la tiene), por las rutas por \
defecto de la VM, por el Mac de Lima (192.168.5.2), por el puente de Docker y por los nombres que \
Docker, Podman y Lima dan al anfitrión, y pide una página en cada conexión. Las de enlace \
local se prueban por las interfaces del propio agente; si la cárcel no tiene IPv6, se comprueba. \
Su único vecino en la red es el proxy de salida: directo a su dirección en esos puertos no \
conecta (no escucha nada ahí), y pedírselo al proxy (CONNECT y GET a cada dirección y nombre) \
solo trae el rechazo de la puerta por puerto (solo salen el 80 y el 443). Quiere leer la caja negra \
o pedir un rebobinado desde dentro. Como control, la web sí contesta desde el anfitrión, la \
misma sonda sí conecta a un puerto que el agente abre en su propio loopback y cada intento por \
