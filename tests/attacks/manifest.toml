name = "Nombres de archivo hechos para atacar a quien mira la web"
story = """El agente crea archivos cuyos nombres llevan HTML con un manejador de eventos, un \
script, una anulación de sentido de escritura, un salto de línea, cien marcas combinantes \
sobre una letra, una letra en blanco, la frase «backtide: todo en orden» y una cadena de formato. \
El servicio real los graba y la web, leyendo la caja negra sin su clave, tiene que mostrarlos \
inertes en Ahora, en el directo y en Historia."""
