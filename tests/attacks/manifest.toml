story = """T26-4b: el archivo de ejemplo tal cual, en un nginx de un contenedor de la VM, con HTTPS de una CA de pruebas y `public_origin` en la instalación de verdad. Sin esa CA, con otro nombre en el saludo TLS o sin nombre no hay conexión. El puerto 80 lleva a https sin repetir nada de la petición. Otro `Host`, en la cabecera o en la línea de la petición, se queda sin respuesta; lo que nginx deja pasar con otro puerto lo rechaza la web por su motivo. El camino entero, por HTTPS: el enlace de root, la primera llave, salir, una firma de otro sitio que no entra y la buena que sí; un `Origin` ajeno se rechaza por su motivo y HSTS va en cada respuesta, también en los rechazos. La página en directo sigue llegando. Como control, 70 conexiones quietas a la web sin proxy la dejan sin sitio; por nginx, 100 peticiones a medias no se notan, y a los 10 s nginx corta el cuerpo y la cabecera a medias. Un cuerpo enorme es un 413. Con la web en marcha y con ella parada, el token del enlace y `?t=` no aparecen en ningún registro (aunque vengan en el `Referer`), y esas mismas peticiones sí están, sin su consulta. Desde la cárcel, el agente no llega a los puertos 80 y 443 de la VM, ni directo ni por su proxy. Es el mismo archivo que copia quien lo instale."""
