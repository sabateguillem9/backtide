leyera un cuerpo de longitud cero y tomara el resto como una segunda petición que la puerta nunca \
vio. La puerta añade ahora el Content-Length del cuerpo que leyó antes de grabar la petición, así \
que al aprobarla el cuerpo entero llega enmarcado como la POST de portada: el DELETE colado no \
llega a ser una segunda petición y el servidor no recibe ninguna petición a esa ruta. La POST de \
portada se retiene como cualquier escritura y sale solo al aprobarla. Es una defensa del proxy, la misma para todo perfil, por lo que corre solo con openclaw."""
