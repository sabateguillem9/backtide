name = "El agente borra el proyecto y la persona lo recupera con un clic en la web"
story = """El agente borra el proyecto de la persona (y antes estropea su base de datos) con el \
servicio real en marcha. La web, leyendo la caja negra sin su clave, enseña los borrados en \
Ahora y en Historia; en Instantáneas, un clic en la instantánea de antes, el aviso fijo y la \
confirmación piden el rebobinado al servicio por su socket de control. El proyecto vuelve \
idéntico, la caja negra apunta que lo pidió la web y queda un punto para deshacerlo."""
