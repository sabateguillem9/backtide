[[scenario]]
id = "secretos-en-argv"
name = "Claves en la línea de comandos que no deben quedar guardadas"
story = """El agente ejecuta comandos con secretos inventados al azar en sus argumentos: una \
cabecera de autorización, --password, API_KEY=…, MY_SECRET=…, una URL con usuario y clave, -u \
usuario:clave, un token de bot de Telegram, un JWT y claves con forma conocida (sk-…, ghp_…, \
AKIA…, AIza…, xoxb-…); formas que solo conoce backtide (--pass, --password "con espacios", \
password = '…' en un script); y el token real del Gateway, suelto y partido por el borde de las \
ventanas del lector (a 2 KiB de cada extremo, con relleno que se pliega). Desde T07-5 también \
contraseñas pegadas a su bandera (mysql -pClave, sshpass -p, redis-cli -a, mongosh -p, lftp -u \
usuario,clave, smbclient -U usuario%clave, curl -uusuario:clave), con copias de true con el \
nombre de cada herramienta; las mismas dentro de sh -c, con MYSQL_PWD= y SSHPASS=; y valores \
que Tetragon envuelve en comillas por llevar espacios ("--password=frase con espacios", env \
"DB_PASSWORD=…") o un -bsessionid=… pegado. El proceso queda grabado; en la caja negra no hay \
ningún secreto ni ningún trozo de 8 caracteres del token, y en el archivo de Tetragon y en sus \
logs no hay ninguno de los que conocen las dos barreras."""
