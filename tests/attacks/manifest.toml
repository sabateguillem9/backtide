story = """Revisión de T26-3c, para T26-4a: con un dominio, cualquiera en internet puede mandar cookies inventadas. El escenario corre por los nombres del túnel, porque los cubos son del servicio y son los mismos con dominio o sin él. Por el socket estrecho, 600 seguidas agotan su propio cubo (la primera `expired`, entre las últimas `busy`, ninguna `live`) y la sesión viva sigue `live` justo después, porque no gasta ese cubo. Por HTTP, con ocho hilos mandando cookies inventadas, ellas reciben 401 o 503 (el del tope del servicio, con su `Retry-After: 5` y la página de entrar) y el dueño, a la vez, entra al menos 57 de 60 veces y nunca ve un 401. Como control, una cookie inventada sola, con el cubo ya lleno, sí es un 401. Los enlaces equivocados agotan su cubo y el enlace de root entra igualmente. El tope queda en la caja negra por el puente del registro."""
