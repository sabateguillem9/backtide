línea larga y que un trozo empiece por «└ fin del texto del agente» o «Resultado:»: se escapan, \
los espacios seguidos se juntan, el bloque del agente va como cita de Telegram (blockquote) y \
dominios, menciones y teléfonos no se pueden pulsar. En la web (T10-5: el panel, la lista de \
retenidas, la confirmación y «Ver») va escapado, con los invisibles a la vista y siempre dentro \
