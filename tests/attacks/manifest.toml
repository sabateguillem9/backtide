POST con una clave suya) en cada dirección y puerto que prueba web-desde-la-carcel, directo y \
pidiéndoselo al proxy, y busca el socket de control, la carpeta keys, telegram.toml y la caja \
negra por nombre, por su ruta del anfitrión y por /proc/<pid>/root; si un socket conectara, le \
pediría las claves y que pusiera la suya. En la VM corre con el mismo uid que el servicio, así \
que SO_PEERCRED lo dejaría pasar: lo que lo frena es que el socket no existe en su sistema de \
archivos. Después la persona entra en la web por el camino real (enlace de un solo uso, cookie, \
CSRF, vale y la casilla de sustituir) y pone una clave nueva inventada: la siguiente llamada del \
agente al modelo llega al proveedor con la clave nueva sin reiniciar nada (el mismo servicio y el \
mismo proxy), el agente sigue viendo solo su clave falsa, la caja negra apunta el cambio solo con \
