# backtide's web behind nginx, on a subdomain of its own. Explained in docs/guide/reverse-proxy.md.
#
# Copy it to /etc/nginx/conf.d/backtide.conf (it goes inside nginx's `http {}`) and change
# backtide.example.org, everywhere it appears, to your name. nginx 1.25.1 or newer. The first
# `server` closes every other name on this nginx: if it serves other sites, leave that block out.

server_tokens off;
# Here and not below: until it has read the head, nginx does not go by the name's `server`, and a
# half-sent head would wait out the default 60 s (measured).
client_header_timeout 10s;

# Who a cap counts as one address: an IPv4 address, or an IPv6 /64, which is what one customer
# usually holds. Counted by the whole IPv6 address, anyone with a /64 would have no cap at all.
map $remote_addr $backtide_client {
    default $remote_addr;
    "~^(?<backtide_net>[0-9a-f]+:[0-9a-f]+:[0-9a-f]+:[0-9a-f]+):" $backtide_net;
    "~^(?<backtide_short>[0-9a-f:]*::)" $backtide_short;
}

# backtide's own caps are for the whole web: it believes no X-Forwarded-For, so they cannot go by
# address. This is the one place that can. A sign-in takes two requests, and these numbers stay
# under what the service gives back (one answer every 6 s), so one address cannot empty its buckets.
limit_req_zone  $backtide_client zone=backtide_sign_in:1m rate=6r/m;
limit_req_zone  $backtide_client zone=backtide_all:5m rate=20r/s;
limit_conn_zone $backtide_client zone=backtide_conn:5m;

# No query string and no Referer: the one-time link's token travels in `/?t=...`. So never
# $request, $request_uri, $args or $http_referer here, and no `combined` for this site.
log_format backtide '$remote_addr [$time_iso8601] "$request_method $uri" $status $body_bytes_sent '
                    '$request_time';

# Any other name, or none: no certificate and no answer.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    access_log off;
    error_log /var/log/nginx/backtide.error.log crit;
    return 444;
}

# Port 80: to https, without what the request carried (a token sent here is in the clear already).
server {
    listen 80;
    listen [::]:80;
    server_name backtide.example.org;
    access_log /var/log/nginx/backtide.access.log backtide;
    error_log /var/log/nginx/backtide.error.log crit;
    return 301 https://backtide.example.org/;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name backtide.example.org;

    ssl_certificate     /etc/letsencrypt/live/backtide.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backtide.example.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # `always`: on the refusals too. nginx drops this if a location sets an add_header of its own.
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/backtide.access.log backtide;
    # crit, not error: an error line quotes the request, query string and Referer included. A
    # failed upstream still shows in the access log, as its 502.
    error_log /var/log/nginx/backtide.error.log crit;
    gzip off;  # the pages carry a CSRF token: no compression next to what a visitor can reflect

    # Slow clients wait here, in nginx. The web only sees a request once it is all in, so they do
    # not hold its 64 connections. Its largest form is 8 KiB: bodies stay in memory, never on disk.
    client_body_timeout     10s;
    send_timeout            30s;
    keepalive_timeout       30s;
    client_max_body_size    16k;
    client_body_buffer_size 16k;
    proxy_request_buffering on;
    proxy_buffering         on;  # the live pages turn it off for themselves (X-Accel-Buffering)

    limit_req_status  429;
    limit_conn_status 429;
    limit_conn backtide_conn 40;
    limit_req  zone=backtide_all burst=200 nodelay;

    # The web only answers its own name, port included: $http_host, as the browser sent it. $host
    # would lose the port of a public_origin that has one. Nothing else is added: the web believes
    # no X-Forwarded-* header.
    proxy_http_version    1.1;
    proxy_set_header      Host $http_host;
    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    60s;

    location / {
        proxy_pass http://127.0.0.1:8765;
    }

    # Anyone can reach these two with no session, and they spend the buckets the owner needs.
    location /entrar/llave/ {
        limit_req zone=backtide_sign_in burst=5 nodelay;
        proxy_pass http://127.0.0.1:8765;
    }
}
