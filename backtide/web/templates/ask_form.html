<form class="ask" action="{{ abase }}/ahora/preguntar" method="get" hx-get="{{ abase }}/ahora/preguntar" hx-target="#feed" hx-swap="beforeend">
  <button class="jump" type="button" hidden>{{ t('feed.new') }}</button>
  <label class="label" for="q">{{ t('chat.label') }}</label>
  <div class="field">
    <input id="q" name="q" type="text" maxlength="200" autocomplete="off" placeholder="{{ t('chat.placeholder') }}">
    <span class="field-line"></span>
    <button class="dot-button" type="submit" aria-label="{{ t('chat.send') }}">{% include "arrow.html" %}</button>
  </div>
</form>
