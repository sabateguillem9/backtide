[project]
name = "backtide"
version = "0.1.0"
description = "Caja negra para agentes de IA: graba lo que hacen, rebobina y frena lo irreversible."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.2",
    "jinja2>=3.1.6",
    "uvicorn>=0.54.0",
]

[project.scripts]
backtide = "backtide.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import backtide from source: on macOS the .venv gets the "hidden" flag and Python skips hidden .pth files.
pythonpath = ["."]
markers = [
    "integration: needs the Linux dev VM (Docker, Btrfs, eBPF)",
    "ataques: evil-agent scenario of tests/attacks, VM only (run with `make ataques`)",
]
# Attacks are never part of `make test` (Mac) or `make it` (-m integration); only `make ataques`.
addopts = "-m 'not integration and not ataques'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
# Fixed-argument subprocess calls (btrfs, docker) are expected in this project.
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
